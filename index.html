<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Aircraft</title>

<style>
html,body {
  margin:0;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#000;
}

iframe {
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  border:0;
  z-index:1;
}

#menu {
  position:fixed;
  top:10px;
  left:10px;
  z-index:99999;
}

#menu button {
  margin-right:4px;
}

#scheduleBox {
  position:fixed;
  top:55px;
  left:10px;
  z-index:99999;
  background:rgba(0,0,0,0.85);
  color:white;
  padding:10px 14px;
  border-radius:8px;
  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.4;
  max-width:350px;
}
</style>
</head>

<body>

<iframe id="map"></iframe>

<div id="menu">
  <button onclick="show('A9C52E')">N729CA</button>
  <button onclick="show('A6CAA1')">N537CA</button>
  <button onclick="show('A8BF91')">N663CA</button>
  <button onclick="show('A7488C')">N569CA</button>
  <button onclick="show('AA3086')">N756CA</button>
  <button onclick="show('A95C2F')">N702CA</button>
  <button onclick="show('ACB84D')">N919CA</button>
  <button onclick="show('ACFC26')">N936CA</button>
  <button onclick="show('AD3C48')">N952CA</button>
</div>

<script>
const base = 'https://globe.adsbexchange.com/?icao=';

function show(hex) {
  document.getElementById('map').src = base + hex;
}

show('A9C52E');


/* AUTOMATIC CALENDAR SCHEDULE */

fetch('schedule.json?ts=' + Date.now())
  .then(response => response.json())
  .then(schedule => {

    const now = new Date();

    const current = schedule.find(event => {
      const start = new Date(event.start);
      const end = new Date(event.end);

      return now >= start && now <= end;
    });

    const upcoming = schedule
      .filter(event => new Date(event.start) > now)
      .sort((a,b) =>
        new Date(a.start) - new Date(b.start)
      )[0];

    const event = current || upcoming;

    if (!event) return;

    const box = document.createElement('div');

    box.id = 'scheduleBox';

    const title = current
      ? 'CURRENT SCHEDULE'
      : 'NEXT FLIGHT';

    box.innerHTML = `
      <div><strong>${title}</strong></div>
      <div>${event.summary || ''}</div>
      <div>${event.location || ''}</div>
    `;

    document.body.appendChild(box);

  })
  .catch(error => {
    console.log('Schedule load error:', error);
  });
</script>

</body>
</html>
